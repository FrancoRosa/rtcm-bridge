<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>NTRIP relay status</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; max-width: 640px; }
    h1 { margin-bottom: 0.25rem; }
    .subtitle { color: #666; margin-bottom: 1.5rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; }
    .card .label { font-size: 0.8rem; color: #666; text-transform: uppercase; letter-spacing: 0.03em; }
    .card .value { font-size: 1.6rem; font-weight: 600; margin-top: 0.25rem; }
    .badge { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 999px; font-size: 0.85rem; font-weight: 600; }
    .badge.ok { background: #dcfce7; color: #166534; }
    .badge.stale { background: #fef9c3; color: #854d0e; }
    .badge.error { background: #fee2e2; color: #991b1b; }
    table { width: 100%; border-collapse: collapse; }
    td { padding: 0.35rem 0; border-bottom: 1px solid #eee; }
    td:first-child { color: #666; }
    td:last-child { text-align: right; font-weight: 600; }
    #error { color: #991b1b; margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>NTRIP relay status</h1>
  <div class="subtitle">Auto-refreshes every second</div>

  <div class="grid">
    <div class="card">
      <div class="label">Uptime</div>
      <div class="value" id="uptime">—</div>
    </div>
    <div class="card">
      <div class="label">Connected clients</div>
      <div class="value" id="totalClients">—</div>
    </div>
    <div class="card">
      <div class="label">Source rate</div>
      <div class="value" id="kbps">—</div>
    </div>
  </div>

  <table>
    <tr><td>Source health</td><td id="health">—</td></tr>
    <tr><td>Mountpoint</td><td id="mountpoint">—</td></tr>
    <tr><td>Caster host</td><td id="host">—</td></tr>
    <tr><td>WebSocket clients</td><td id="wsClients">—</td></tr>
    <tr><td>NTRIP TCP clients</td><td id="ntripClients">—</td></tr>
    <tr><td>Total data received</td><td id="totalBytes">—</td></tr>
    <tr><td>Last data received</td><td id="lastData">—</td></tr>
  </table>

  <div id="error"></div>

  <script>
    function formatUptime(seconds) {
      const d = Math.floor(seconds / 86400);
      const h = Math.floor((seconds % 86400) / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = seconds % 60;
      const parts = [];
      if (d) parts.push(`${d}d`);
      if (d || h) parts.push(`${h}h`);
      if (d || h || m) parts.push(`${m}m`);
      parts.push(`${s}s`);
      return parts.join(' ');
    }

    function formatBytes(bytes) {
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
      return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
    }

    function healthOf(source) {
      if (source.error) return { text: 'error', cls: 'error' };
      if (source.closed) return { text: 'closed', cls: 'error' };
      if (!source.ready) return { text: 'connecting', cls: 'stale' };
      if (source.lastDataAgoMs === null || source.lastDataAgoMs > 15000) return { text: 'stale', cls: 'stale' };
      return { text: 'ok', cls: 'ok' };
    }

    async function refresh() {
      try {
        const res = await fetch('/metrics', { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const m = await res.json();

        document.getElementById('uptime').textContent = formatUptime(m.uptimeSeconds);
        const totalClients = m.clients.websocket + m.clients.ntrip;
        document.getElementById('totalClients').textContent = totalClients;
        document.getElementById('kbps').textContent = `${m.source.kbps.toFixed(1)} kbps`;

        const health = healthOf(m.source);
        document.getElementById('health').innerHTML = `<span class="badge ${health.cls}">${health.text}</span>`;
        document.getElementById('mountpoint').textContent = m.source.mountpoint;
        document.getElementById('host').textContent = m.source.host;
        document.getElementById('wsClients').textContent = m.clients.websocket;
        document.getElementById('ntripClients').textContent = m.clients.ntrip;
        document.getElementById('totalBytes').textContent = formatBytes(m.source.totalBytes);
        document.getElementById('lastData').textContent =
          m.source.lastDataAgoMs === null ? 'never' : `${(m.source.lastDataAgoMs / 1000).toFixed(1)}s ago`;

        document.getElementById('error').textContent = '';
      } catch (err) {
        document.getElementById('error').textContent = `failed to load metrics: ${err.message}`;
      }
    }

    refresh();
    setInterval(refresh, 1000);
  </script>
</body>
</html>
